org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 的内置 Kotlin 与 Flutter 3.47 的 Gradle 插件不兼容（会强制读取新 DSL），
# 这里保持模板默认：由 Flutter 的 Gradle 插件为各子工程补齐 Kotlin Gradle Plugin。
android.builtInKotlin=false
# Kotlin 增量编译在本机（Windows + Gradle 9 + 插件多模块）会报
# "Could not close incremental caches ... Storage ... is already registered"，
# 直接导致 assembleDebug 失败；关掉增量编译换构建可重复，CI 同样适用。
kotlin.incremental=false
