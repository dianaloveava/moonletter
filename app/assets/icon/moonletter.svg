<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFD3CE"/>
      <stop offset="1" stop-color="#EC8A91"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="566" cy="458" r="240" fill="#000000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9E2B3F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>

  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="250" fill="#FFFFFF" mask="url(#cut)"/>
    <circle cx="600" cy="436" r="38" fill="#CF3B59"/>
  </g>
</svg>